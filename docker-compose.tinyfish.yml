# TinyFish products as uniquely named TinyBot services (project: tinybot-tinyfish).
#
# This is the host-port overlay. Product source is not vendored. Each service builds
# from its private GitHub repo (Docker git context) and publishes a unique loopback
# port so the six start-page cards do not share :8080 / :8765.
#
# scripts/tinyfish/start-products.ts prefers wrapping each product's own compose
# (sibling checkout or a gitignored .tinyfish-siblings/ clone) as its own Compose
# project. This file is the fallback when no checkout exists and Docker can clone
# the private repos. Include-into-the-TinyBot-project was not used: sibling service
# names such as postgres would collide with TinyBot and with each other.
#
# Native ports and compose service names (verified on the product PRs; source
# is not vendored). Wrap these services, not webhook/postgres:
#   tinypipe  tinyfish-web  3712
#   tinytail  ltdf          8765
#   tinypulse feed          8080  (8081/8090 stay unpublished)
#   tinyweb   tinyfish-web  8765
#   tinywatch engine        8080  (webhook 8081 stays unpublished)
#   tinykit   gallery       8080
# Each product honors PORT and GET /health → 200 {ok, product, usage_id}.
#
# TinyPipe is the auth socket. Start it first. TinyBot sign-in uses
# TINYFISH_MCP_URL=http://127.0.0.1:3712/mcp and the fixture issuer.

name: tinybot-tinyfish

services:
  tinypipe:
    build:
      context: https://github.com/mariodelgado/tf-03-mcp-distribution.git
    ports:
      - "127.0.0.1:${TINYPIPE_HOST_PORT:-3712}:${TINYPIPE_PORT:-3712}"
    environment:
      PORT: ${TINYPIPE_PORT:-3712}
      TINYFISH_ISSUER: ${TINYFISH_ISSUER:-https://issuer.fixtures.tinyfish.test}

  tinytail:
    build:
      context: https://github.com/mariodelgado/js-01-long-tail-dataset.git
    depends_on:
      - tinypipe
    ports:
      - "127.0.0.1:${TINYTAIL_HOST_PORT:-18765}:${TINYTAIL_PORT:-8765}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${TINYTAIL_PORT:-8765}
      TINYFISH_MCP_URL: ${TINYFISH_MCP_URL:-http://host.docker.internal:3712/mcp}
      TINYFISH_ISSUER: ${TINYFISH_ISSUER:-https://issuer.fixtures.tinyfish.test}

  tinypulse:
    build:
      context: https://github.com/mariodelgado/js-02-physical-events.git
    depends_on:
      - tinypipe
    ports:
      - "127.0.0.1:${TINYPULSE_HOST_PORT:-18082}:${TINYPULSE_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${TINYPULSE_PORT:-8080}
      TINYFISH_MCP_URL: ${TINYFISH_MCP_URL:-http://host.docker.internal:3712/mcp}
      TINYFISH_ISSUER: ${TINYFISH_ISSUER:-https://issuer.fixtures.tinyfish.test}

  tinyweb:
    build:
      context: https://github.com/mariodelgado/js-03-governed-web.git
    depends_on:
      - tinypipe
    ports:
      - "127.0.0.1:${TINYWEB_HOST_PORT:-18766}:${TINYWEB_PORT:-8765}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${TINYWEB_PORT:-8765}
      TINYFISH_MCP_URL: ${TINYFISH_MCP_URL:-http://host.docker.internal:3712/mcp}
      TINYFISH_ISSUER: ${TINYFISH_ISSUER:-https://issuer.fixtures.tinyfish.test}

  tinywatch:
    build:
      context: https://github.com/mariodelgado/tf-01-trigger-rules.git
    depends_on:
      - tinypipe
    ports:
      - "127.0.0.1:${TINYWATCH_HOST_PORT:-18081}:${TINYWATCH_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${TINYWATCH_PORT:-8080}
      TINYFISH_MCP_URL: ${TINYFISH_MCP_URL:-http://host.docker.internal:3712/mcp}
      TINYFISH_ISSUER: ${TINYFISH_ISSUER:-https://issuer.fixtures.tinyfish.test}

  tinykit:
    build:
      context: https://github.com/mariodelgado/tf-02-recipe-gallery.git
    depends_on:
      - tinypipe
    ports:
      - "127.0.0.1:${TINYKIT_HOST_PORT:-18083}:${TINYKIT_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: ${TINYKIT_PORT:-8080}
      TINYFISH_MCP_URL: ${TINYFISH_MCP_URL:-http://host.docker.internal:3712/mcp}
      TINYFISH_ISSUER: ${TINYFISH_ISSUER:-https://issuer.fixtures.tinyfish.test}
