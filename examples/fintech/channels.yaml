    name: TinyPing
    description: Funnel first.
    permitted_agents: [tinyping]
    allowed_groups: [all]
  - id: tinytrigger
    name: TinyTrigger
    description: Watch / When / Do. T1 required.
    permitted_agents: [tinytrigger]
    allowed_groups: [all]
  - id: tinyreg
