    permitted_agents: [tinybrief]
    allowed_groups: [all]
  - id: tinydeed
    name: TinyDeed
    description: Deed.
    permitted_agents: [tinydeed]
    allowed_groups: [all]
  - id: tinyfeed
    name: TinyFeed
    description: Event feed. Graph is read-only.
    permitted_agents: [tinyfeed]
    allowed_groups: [all]
  - id: tinyfoundry
    name: TinyFoundry
    description: Foundry.
    permitted_agents: [tinyfoundry]
    allowed_groups: [all]
  - id: tinymargin
    name: TinyMargin
