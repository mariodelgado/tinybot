# Package-provided TinyFish board. Public, ownerless, and built-in so they
# are reachable the moment the deployment starts. Empty-state agents are these
# 11 (TinyPing first), not OpenBot samples and not the platform backends.
# Platform (TinyPipe, TinyTail, TinyWeb, TinyKit) stay startable/proxyable.
agents:
